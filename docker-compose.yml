services:
  chatter-server:
    build:
      context: .
      dockerfile: Chatter.Server/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - chatter-data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Required: the server refuses to start without its own JWT signing key (used to both
      # issue and validate tokens from /auth/login and /auth/register). Generate your own -
      # e.g. `openssl rand -base64 48` - never reuse the one in this repo's dev settings.
      - Jwt__SigningKey=replace-me-with-a-real-random-secret

volumes:
  chatter-data:
